    <ul class="navbar-links flex items-center gap-8">
      <li>

          Home
        </a>
      </li>
      <li>
        <a routerLink="/apartments" routerLinkActive="active" [class.active]="isActive('/apartments')"

      </li>
      <li>

        </a>
      </li>
      <li>
