<main class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="flex items-center justify-center gap-2 mb-4">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span style="font-size:1.3rem;font-weight:800;color:#4f46e5;">RentHub</span>
        </div>
        <h2>Create an account</h2>
        <p>Join RentHub as a tenant or landlord</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Role selector (cards) -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-text-secondary mb-2">I am a…</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="role-card" [class.role-card-active]="registerForm.get('role')?.value === 'TENANT'">
              <input type="radio" formControlName="role" value="TENANT" class="sr-only"/>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <span>Tenant</span>
            </label>
            <label class="role-card" [class.role-card-active]="registerForm.get('role')?.value === 'LANDLORD'">
              <input type="radio" formControlName="role" value="LANDLORD" class="sr-only"/>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <span>Landlord</span>
            </label>
          </div>
        </div>

        <div class="form-group mb-4">
          <label class="block text-sm font-medium text-text-secondary mb-1.5">Full Name</label>
          <input formControlName="fullName" type="text" placeholder="John Doe" class="form-input w-full"
            [class.input-error]="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched"/>
          <div *ngIf="registerForm.get('fullName')?.errors?.['required'] && registerForm.get('fullName')?.touched"
               class="text-xs text-red-500 mt-1">Full name is required</div>
        </div>

        <div class="form-group mb-4">
          <label class="block text-sm font-medium text-text-secondary mb-1.5">Email Address</label>
          <input formControlName="email" type="email" placeholder="you@example.com" class="form-input w-full"
            [class.input-error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"/>
          <div *ngIf="registerForm.get('email')?.errors?.['required'] && registerForm.get('email')?.touched"
               class="text-xs text-red-500 mt-1">Email is required</div>
          <div *ngIf="registerForm.get('email')?.errors?.['email'] && registerForm.get('email')?.touched"
               class="text-xs text-red-500 mt-1">Enter a valid email</div>
        </div>

        <div class="form-group mb-4">
          <label class="block text-sm font-medium text-text-secondary mb-1.5">Phone <span class="text-text-muted font-normal">(optional)</span></label>
          <input formControlName="phone" type="tel" placeholder="+91 98765 43210" class="form-input w-full"/>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="form-group">
            <label class="block text-sm font-medium text-text-secondary mb-1.5">Password</label>
            <input formControlName="password" type="password" placeholder="••••••••" class="form-input w-full"
              [class.input-error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"/>
            <div *ngIf="registerForm.get('password')?.errors?.['minlength'] && registerForm.get('password')?.touched"
                 class="text-xs text-red-500 mt-1">Min 6 characters</div>
          </div>
          <div class="form-group">
            <label class="block text-sm font-medium text-text-secondary mb-1.5">Confirm</label>
            <input formControlName="confirmPassword" type="password" placeholder="••••••••" class="form-input w-full"
              [class.input-error]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched"/>
            <div *ngIf="registerForm.get('confirmPassword')?.errors?.['mismatch'] && registerForm.get('confirmPassword')?.touched"
                 class="text-xs text-red-500 mt-1">Passwords don't match</div>
          </div>
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isSubmitting"
                class="btn-primary w-full" style="padding:0.7rem;font-size:0.95rem;">
          {{ isSubmitting ? 'Creating account…' : 'Create Account' }}
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login" class="font-semibold text-primary hover:underline">Sign in</a></p>
      </div>

    </div>
  </div>
</main>
