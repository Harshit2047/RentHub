<main class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="flex items-center justify-center gap-2 mb-4">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span style="font-size:1.3rem;font-weight:800;color:#4f46e5;">RentHub</span>
        </div>
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="form-group mb-4">
          <label for="email" class="block text-sm font-medium text-text-secondary mb-1.5">Email Address</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="you@example.com"
            class="form-input w-full"
            [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
          <div *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched"
               class="text-xs text-red-500 mt-1">Email is required</div>
          <div *ngIf="loginForm.get('email')?.errors?.['email'] && loginForm.get('email')?.touched"
               class="text-xs text-red-500 mt-1">Enter a valid email address</div>
        </div>

        <div class="form-group mb-6">
          <label for="password" class="block text-sm font-medium text-text-secondary mb-1.5">Password</label>
          <input
            id="password"
            formControlName="password"
            type="password"
            placeholder="••••••••"
            class="form-input w-full"
            [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <div *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched"
               class="text-xs text-red-500 mt-1">Password is required</div>
          <div *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched"
               class="text-xs text-red-500 mt-1">Password must be at least 6 characters</div>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting"
          class="btn-primary w-full"
          style="padding: 0.7rem; font-size:0.95rem;"
        >
          {{ isSubmitting ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register" class="font-semibold text-primary hover:underline">Create one</a></p>
      </div>

    </div>
  </div>
</main>
